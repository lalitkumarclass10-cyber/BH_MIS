<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f"><meta name="description" content="LALIT_BH Eye Hospital Business Command Center">
<link rel="manifest" href="manifest.json"><title>LALIT_BH — Eye Hospital Business Command Center</title>
<style>
:root{--bg:#07101d;--card:#0e1a2b;--card2:#111f33;--line:#263a54;--text:#eef5ff;--muted:#9db0c8;--accent:#62a8ff;--good:#45d483;--warn:#ffc857;--bad:#ff6678;--shadow:0 12px 35px #0005}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#07101d,#091526 55%,#06101c);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1400px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 4px 18px;border-bottom:1px solid var(--line)}.brand h1{margin:0;font-size:28px}.brand p{margin:4px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#0c1728;color:var(--text);padding:10px 14px;border-radius:12px}.btn.primary{background:var(--accent);color:#06101d;border-color:var(--accent);font-weight:800}.btn.good{background:#143e2b;border-color:#276a49}.btn.danger{background:#421b23;border-color:#73303c}.nav{display:flex;gap:8px;overflow:auto;padding:14px 0;position:sticky;top:0;background:#07101df2;z-index:5}.nav button{white-space:nowrap}.nav button.active{background:var(--accent);color:#06101d;font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:linear-gradient(180deg,#0f1c2e,#0c1828);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.kpi{font-size:26px;font-weight:850}.small{font-size:12px}.positive{color:var(--good)}.negative{color:var(--bad)}.warning{color:var(--warn)}.progress{height:9px;background:#07111f;border-radius:10px;overflow:hidden;margin:8px 0}.progress>i{display:block;height:100%;background:var(--accent);width:0}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{border-bottom:1px solid #203249;padding:9px;text-align:right}.table th:first-child,.table td:first-child{text-align:left}.table th{color:#b9cae0;font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:12px;color:#a9bad0}.field input,.field select{width:100%;background:#07111f;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px}.formgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.metric-group{margin-top:14px}.metric-group h3{color:#cfe0f5;font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:8px;flex-wrap:wrap}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}.chart{height:280px;position:relative}.chart canvas{width:100%;height:100%}.alert{border-left:4px solid var(--warn);padding:10px 12px;background:#1c1a10;border-radius:8px;margin:8px 0}.ai{border:1px solid #3a4e6b;background:linear-gradient(135deg,#101e31,#0c1728)}.ai h3{color:#bcd8ff}.footer{text-align:center;color:var(--muted);padding:18px}.hidden{display:none!important}@media(max-width:1000px){.grid{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{padding:12px}.top{align-items:flex-start;flex-direction:column}.grid,.grid2,.grid3,.formgrid{grid-template-columns:1fr}.brand h1{font-size:24px}.nav{top:0}.card{padding:13px}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand"><h1>👁 LALIT_BH</h1><p>Eye Hospital Business Command Center</p></div><div class="actions"><button class="btn" id="installBtn">Install</button><button class="btn" id="backupBtn">Backup</button><button class="btn" id="restoreBtn">Restore</button><input id="restoreFile" type="file" accept="application/json" class="hidden"></div></header>
<nav class="nav" id="nav"></nav><main id="app"></main><div class="footer">Offline-ready • Local data on this device • Export/backup regularly • AI analysis requires a secure AI endpoint</div></div>
<script>
const FIELDS={
"OPD":[['newMrd','New MRD','count'],['oldMrd','Old MRD','count'],['totalOp','Total OP','calc'],['op50','50+ OP','count'],['op18_35','18–35 Relevant OP','count'],['rcoAdvise','RCO Advise','count']],
"Optical":[['opticalAdvise','Optical Advise','count'],['opticalSold','Optical Sold','count'],['opticalRevenue','Optical Revenue','money'],['opticalArp','Optical ARP','calcMoney']],
"Medicine":[['medicineAdvise','Medicine Advise','count'],['medicineSold','Medicine Sold','count'],['medicineRevenue','Medicine Revenue','money'],['medicineArp','Medicine ARP','calcMoney']],
"Revenue / Procedures":[['consultationRevenue','Consultation Revenue','money'],['procedureDone','Procedure Done','count'],['procedureRevenue','Procedure Revenue','money']],
"Cataract":[['cataractDiagnose','Cataract Diagnose','count'],['catAdvised','Cat Advised','count'],['catDone','Cat Done','count'],['catRevenue','Cat Revenue','money'],['catArp','Cat ARP','calcMoney']],
"LASIK":[['lasikAdvise','LASIK Advise','count'],['lasikDone','LASIK Done','count'],['lasikRevenue','LASIK Revenue','money'],['lasikArp','LASIK ARP','calcMoney']],
"Retina":[['retinaAdvise','Retina Advise','count'],['retinaDone','Retina Done','count'],['retinaRevenue','Retina Revenue','money'],['retinaArp','Retina ARP','calcMoney']],
"Super Speciality":[['sscoAdvised','SSCO Advised','count'],['ssAdvise','SS Advise','count'],['ssDone','SS Done','count'],['ssRevenue','SS Revenue','money'],['ssArp','SS ARP','calcMoney']],
"Reviews":[['googleReview','Google Reviews','count']]
};
const targetKeys=Object.entries(FIELDS).flatMap(([g,a])=>a.filter(x=>x[2]!=='calc'&&x[2]!=='calcMoney').map(x=>x[0]));
const labels=Object.fromEntries(Object.entries(FIELDS).flatMap(([g,a])=>a.map(x=>[x[0],x[1]])));
const moneyKeys=new Set(Object.entries(FIELDS).flatMap(([g,a])=>a.filter(x=>x[2]==='money'||x[2]==='calcMoney').map(x=>x[0])));
const calcKeys=new Set(['totalOp','opticalArp','medicineArp','catArp','lasikArp','retinaArp','ssArp']);
const revenueKeys=['opticalRevenue','medicineRevenue','consultationRevenue','procedureRevenue','catRevenue','lasikRevenue','retinaRevenue','ssRevenue'];
const defaultState={daily:{},targets:{},ly:{},leaves:[],settings:{aiEndpoint:'',currency:'₹'}};
let state=load();let current='dashboard';let deferredPrompt=null;
function load(){try{return {...defaultState,...JSON.parse(localStorage.getItem('lalit_bh_final')||'{}')}}catch(e){return structuredClone(defaultState)}}
function save(){localStorage.setItem('lalit_bh_final',JSON.stringify(state))}
function num(v){return Number(v)||0} function fmt(n,money=false){return money?'₹'+Math.round(n).toLocaleString('en-IN'):Math.round(n).toLocaleString('en-IN')}
function monthKey(date){return date.slice(0,7)} function daysInMonth(ym){let [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function blank(){let o={};for(const k of targetKeys)o[k]=0;return o}
function normalize(x){x={...blank(),...(x||{})};x.totalOp=num(x.newMrd)+num(x.oldMrd);x.opticalArp=num(x.opticalSold)?num(x.opticalRevenue)/num(x.opticalSold):0;x.medicineArp=num(x.medicineSold)?num(x.medicineRevenue)/num(x.medicineSold):0;x.catArp=num(x.catDone)?num(x.catRevenue)/num(x.catDone):0;x.lasikArp=num(x.lasikDone)?num(x.lasikRevenue)/num(x.lasikDone):0;x.retinaArp=num(x.retinaDone)?num(x.retinaRevenue)/num(x.retinaDone):0;x.ssArp=num(x.ssDone)?num(x.ssRevenue)/num(x.ssDone):0;return x}
function sumMonth(ym,source=state.daily){let out=blank();for(const [d,x] of Object.entries(source)){if(d.startsWith(ym)){x=normalize(x);for(const k of targetKeys)out[k]+=num(x[k])}}out.totalOp=out.newMrd+out.oldMrd;return out}
function lyMonth(ym){return {...blank(),...(state.ly[ym]||{})}}
function targetMonth(ym){return {...blank(),...(state.targets[ym]||{})}}
function achievement(a,t){return t?100*a/t:0}
function growth(a,l){return l?100*(a-l)/l:null}
function revenue(x){return revenueKeys.reduce((s,k)=>s+num(x[k]),0)}
function metricCard(title,val,sub,cls=''){return `<div class="card"><div class="muted small">${title}</div><div class="kpi ${cls}">${val}</div><div class="small muted">${sub||''}</div></div>`}
function render(){document.getElementById('nav').innerHTML=[['dashboard','Dashboard'],['daily','Daily Entry'],['targets','Targets'],['ly','Last Year'],['analytics','Analytics'],['levers','Business Levers'],['leave','Staff Leave'],['settings','Settings']].map(([k,l])=>`<button class="btn ${current===k?'active':''}" onclick="go('${k}')">${l}</button>`).join('');document.getElementById('app').innerHTML=views();if(current==='dashboard'||current==='analytics')setTimeout(drawCharts,30)}
function go(k){current=k;render()}
function views(){return {dashboard:viewDashboard,daily:viewDaily,targets:viewTargets,ly:viewLY,analytics:viewAnalytics,levers:viewLevers,leave:viewLeave,settings:viewSettings}[current]}
function viewDashboard(){let ym=new Date().toISOString().slice(0,7),a=sumMonth(ym),t=targetMonth(ym),l=lyMonth(ym),r=revenue(a),rt=achievement(r,t.opticalRevenue+ t.medicineRevenue+t.consultationRevenue+t.procedureRevenue+t.catRevenue+t.lasikRevenue+t.retinaRevenue+t.ssRevenue),g=growth(r,revenue(l));return `<div class="card"><div class="section-title"><div><h2>Command Center</h2><div class="muted">${ym} • Actual vs Target vs Last Year</div></div><span class="pill">${state.settings.aiEndpoint?'AI connected':'AI endpoint not configured'}</span></div></div><div class="grid">${metricCard('Total Revenue',fmt(r,true),t?`${rt.toFixed(0)}% of target`:'' ,rt>=100?'positive':rt>=80?'warning':'negative')}${metricCard('Total OP',fmt(a.totalOp),t.totalOp?`${achievement(a.totalOp,t.totalOp).toFixed(0)}% target`:'Target not set')}${metricCard('Cataract Done',fmt(a.catDone),t.catDone?`${achievement(a.catDone,t.catDone).toFixed(0)}% target`:'Target not set')}${metricCard('Google Reviews',fmt(a.googleReview),t.googleReview?`${achievement(a.googleReview,t.googleReview).toFixed(0)}% target`:'Target not set')}</div><div class="grid2"><div class="card"><h3>Revenue trend</h3><div class="chart"><canvas id="revChart"></canvas></div></div><div class="card ai"><h3>🤖 AI Business Brief</h3><div id="aiBrief">${localInsights(ym)}</div><button class="btn primary" onclick="runAI()">Analyse my data</button></div></div><div class="card"><h3>Top management signals</h3>${signals(ym,a,t,l)}</div>`}
function signals(ym,a,t,l){let arr=[];for(const k of targetKeys){if(['totalOp'].includes(k))continue;let av=achievement(a[k],t[k]);if(t[k]&&av<80)arr.push(`<div class="alert"><b>${labels[k]}</b>: ${fmt(a[k],moneyKeys.has(k))} vs target ${fmt(t[k],moneyKeys.has(k))} (${av.toFixed(0)}%).</div>`)}if(growth(a.catDone,l.catDone)!==null&&growth(a.catDone,l.catDone)<0)arr.push(`<div class="alert"><b>Cataract done</b> is ${Math.abs(growth(a.catDone,l.catDone)).toFixed(1)}% below LY.</div>`);return arr.slice(0,8).join('')||'<div class="muted">No major alerts. Enter targets and LY data for deeper analysis.</div>'}
function viewDaily(){let today=new Date().toISOString().slice(0,10),x=normalize(state.daily[today]);return `<div class="card"><div class="section-title"><div><h2>Daily Data Entry</h2><div class="muted">Enter the daily base data. Total OP and ARP are automatic.</div></div><input id="dailyDate" type="date" value="${today}" onchange="loadDaily(this.value)"></div><div id="dailyForm">${dailyForm(x)}</div><button class="btn primary" onclick="saveDaily()">Save Daily Data</button></div>`}
function dailyForm(x){return Object.entries(FIELDS).map(([g,a])=>`<div class="metric-group"><h3>${g}</h3><div class="formgrid">${a.map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-k="${k}" ${t==='calc'||t==='calcMoney'?'readonly':''} value="${t==='calc'||t==='calcMoney'?calcDisplay(k,x):num(x[k])}" type="number" step="0.01"></div>`).join('')}</div></div>`).join('')}
function calcDisplay(k,x){return k==='totalOp'?num(x.newMrd)+num(x.oldMrd):['opticalArp','medicineArp','catArp','lasikArp','retinaArp','ssArp'].includes(k)?num(x[k]).toFixed(2):0}
function loadDaily(d){document.getElementById('dailyForm').innerHTML=dailyForm(normalize(state.daily[d]||blank()))}
function saveDaily(){let d=document.getElementById('dailyDate').value,x=blank();document.querySelectorAll('#dailyForm [data-k]').forEach(i=>x[i.dataset.k]=num(i.value));state.daily[d]=normalize(x);save();alert('Daily data saved.');render()}
function viewTargets(){let ym=new Date().toISOString().slice(0,7),x=targetMonth(ym);return `<div class="card"><div class="section-title"><div><h2>Monthly Targets</h2><div class="muted">All targetable base metrics. ARP is calculated, never manually targeted here.</div></div><input id="targetMonth" type="month" value="${ym}" onchange="loadTargets(this.value)"></div><div id="targetForm">${targetForm(x)}</div><button class="btn primary" onclick="saveTargets()">Save Targets</button></div>`}
function targetForm(x){return Object.entries(FIELDS).map(([g,a])=>`<div class="metric-group"><h3>${g}</h3><div class="formgrid">${a.filter(([k,l,t])=>t!=='calc'&&t!=='calcMoney').map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-t="${k}" type="number" step="0.01" value="${num(x[k])}"></div>`).join('')}</div></div>`).join('')}
function loadTargets(m){document.getElementById('targetForm').innerHTML=targetForm(targetMonth(m))}
function saveTargets(){let m=document.getElementById('targetMonth').value,x=blank();document.querySelectorAll('#targetForm [data-t]').forEach(i=>x[i.dataset.t]=num(i.value));state.targets[m]=x;save();alert('Targets saved.');render()}
function viewLY(){let ym=new Date().toISOString().slice(0,7),x=lyMonth(ym);return `<div class="card"><div class="section-title"><div><h2>Last Year Baseline</h2><div class="muted">Enter monthly LY totals. Google Reviews can also be stored here for comparison.</div></div><input id="lyMonth" type="month" value="${ym}" onchange="loadLY(this.value)"></div><div id="lyForm">${lyForm(x)}</div><button class="btn primary" onclick="saveLY()">Save LY Baseline</button></div>`}
function lyForm(x){return Object.entries(FIELDS).map(([g,a])=>`<div class="metric-group"><h3>${g}</h3><div class="formgrid">${a.filter(([k,l,t])=>t!=='calc'&&t!=='calcMoney').map(([k,l,t])=>`<div class="field"><label>${l}</label><input data-l="${k}" type="number" step="0.01" value="${num(x[k])}"></div>`).join('')}</div></div>`).join('')}
function loadLY(m){document.getElementById('lyForm').innerHTML=lyForm(lyMonth(m))}function saveLY(){let m=document.getElementById('lyMonth').value,x=blank();document.querySelectorAll('#lyForm [data-l]').forEach(i=>x[i.dataset.l]=num(i.value));state.ly[m]=x;save();alert('LY baseline saved.');render()}
function viewAnalytics(){let ym=new Date().toISOString().slice(0,7),a=sumMonth(ym),t=targetMonth(ym),l=lyMonth(ym);return `<div class="card"><h2>Analytics</h2><div class="muted">Management analytics for ${ym}. All figures come from your saved daily data.</div></div><div class="grid3">${metricCard('Revenue / OP',a.totalOp?fmt(revenue(a)/a.totalOp,true):'₹0','tracked revenue ÷ OP')}${metricCard('Optical conversion',a.opticalAdvise?((a.opticalSold/a.opticalAdvise)*100).toFixed(1)+'%':'0%','sold ÷ advised')}${metricCard('Cataract conversion',a.catAdvised?((a.catDone/a.catAdvised)*100).toFixed(1)+'%':'0%','done ÷ advised')}</div><div class="grid2"><div class="card"><h3>Target achievement</h3><div class="chart"><canvas id="targetChart"></canvas></div></div><div class="card"><h3>Revenue mix</h3><div class="chart"><canvas id="mixChart"></canvas></div></div></div><div class="card"><h3>Actual vs LY growth</h3><div class="tablewrap"><table class="table"><thead><tr><th>Metric</th><th>Actual</th><th>LY</th><th>Growth</th></tr></thead><tbody>${targetKeys.map(k=>{let gr=growth(a[k],l[k]);return `<tr><td>${labels[k]}</td><td>${fmt(a[k],moneyKeys.has(k))}</td><td>${fmt(l[k],moneyKeys.has(k))}</td><td class="${gr===null?'':gr>=0?'positive':'negative'}">${gr===null?'—':gr.toFixed(1)+'%'}</td></tr>`}).join('')}</tbody></table></div></div>`}
function viewLevers(){let ym=new Date().toISOString().slice(0,7),a=sumMonth(ym),l=lyMonth(ym);let ks=[['18–35 Relevant OP','op18_35'],['Cataract Diagnosed','cataractDiagnose'],['Optical Advised','opticalAdvise'],['SSCO Advised','sscoAdvised'],['RCO Advised','rcoAdvise']];return `<div class="card"><h2>Business Levers</h2><div class="muted">Leading indicators that influence downstream revenue.</div></div><div class="grid">${ks.map(([n,k])=>{let gr=growth(a[k],l[k]);return metricCard(n,fmt(a[k]),gr===null?'LY not entered':`LY ${fmt(l[k])} • ${gr.toFixed(1)}%`,gr!==null&&gr<0?'negative':'')}).join('')}</div><div class="card"><h3>Management interpretation</h3><p>If a leading lever falls while downstream revenue also falls, the first response should usually be at the source/funnel stage—not only at the billing stage.</p></div>`}
function viewLeave(){return `<div class="card"><h2>Staff Leave</h2><div class="formgrid"><div class="field"><label>Staff name</label><input id="ln" placeholder="Name"></div><div class="field"><label>From</label><input id="lf" type="date"></div><div class="field"><label>To</label><input id="lt" type="date"></div></div><button class="btn primary" onclick="addLeave()">Add Leave</button></div><div class="card"><div class="tablewrap"><table class="table"><thead><tr><th>Staff</th><th>From</th><th>To</th><th>Action</th></tr></thead><tbody>${state.leaves.map((x,i)=>`<tr><td>${esc(x.name)}</td><td>${x.from}</td><td>${x.to}</td><td><button class="btn danger" onclick="delLeave(${i})">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addLeave(){let name=document.getElementById('ln').value.trim(),from=document.getElementById('lf').value,to=document.getElementById('lt').value;if(!name||!from||!to)return alert('Fill all leave fields.');state.leaves.push({name,from,to});save();render()}function delLeave(i){state.leaves.splice(i,1);save();render()}
function viewSettings(){return `<div class="card"><h2>Settings & AI</h2><p class="muted">For secure AI, the app should call a server-side endpoint. Never paste an OpenAI API key into this browser app.</p><div class="field"><label>Secure AI endpoint URL</label><input id="aiEndpoint" value="${esc(state.settings.aiEndpoint||'')}" placeholder="https://your-worker.example.workers.dev/analyze"></div><br><button class="btn primary" onclick="saveSettings()">Save Settings</button><div class="card ai" style="margin-top:16px"><h3>AI capabilities</h3><ul><li>Executive daily/monthly business brief</li><li>Target misses and likely funnel bottlenecks</li><li>LY growth/decline interpretation</li><li>Revenue mix and ARP analysis</li><li>Prioritised action plan for operations</li><li>Chart-aware narrative based only on your supplied data</li></ul></div></div><div class="card"><h3>Data management</h3><button class="btn" onclick="exportCSV()">Export Daily CSV</button> <button class="btn" onclick="exportJSON()">Export Full JSON</button> <button class="btn danger" onclick="wipe()">Delete all local data</button></div>`}
function saveSettings(){state.settings.aiEndpoint=document.getElementById('aiEndpoint').value.trim();save();alert('Settings saved.');render()}
function localInsights(ym){let a=sumMonth(ym),t=targetMonth(ym),l=lyMonth(ym),r=revenue(a);let bits=[];if(t.totalOp)bits.push(`OP is at ${achievement(a.totalOp,t.totalOp).toFixed(0)}% of target.`);if(t.catDone)bits.push(`Cataract completion is at ${achievement(a.catDone,t.catDone).toFixed(0)}% of target.`);let gr=growth(r,revenue(l));if(gr!==null)bits.push(`Tracked revenue is ${gr>=0?'up':'down'} ${Math.abs(gr).toFixed(1)}% vs LY.`);return bits.join(' ')||'Enter daily data, targets and LY baseline to generate the management brief.'}
async function runAI(){let ep=state.settings.aiEndpoint;if(!ep)return alert('Open Settings and add your secure AI endpoint first. The app includes an AI-worker template in the download package.');let ym=new Date().toISOString().slice(0,7),payload={month:ym,actual:sumMonth(ym),target:targetMonth(ym),lastYear:lyMonth(ym),labels};try{document.getElementById('aiBrief').innerHTML='<span class="muted">Analysing…</span>';let r=await fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let j=await r.json();if(!r.ok)throw new Error(j.error||'AI request failed');document.getElementById('aiBrief').innerHTML=formatAI(j)}catch(e){document.getElementById('aiBrief').innerHTML='<span class="negative">AI analysis failed: '+esc(e.message)+'</span>'}}
function formatAI(j){if(typeof j==='string')return esc(j);let s='';if(j.summary)s+=`<p>${esc(j.summary)}</p>`;if(Array.isArray(j.alerts))s+='<h4>Alerts</h4><ul>'+j.alerts.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';if(Array.isArray(j.actions))s+='<h4>Priority actions</h4><ol>'+j.actions.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>';if(j.outlook)s+=`<p><b>Outlook:</b> ${esc(j.outlook)}</p>`;return s||'No AI narrative returned.'}
function drawCharts(){let ym=new Date().toISOString().slice(0,7),a=sumMonth(ym),t=targetMonth(ym);drawLine('revChart',monthlySeries('revenue',6));drawBar('targetChart',[['OP',achievement(a.totalOp,t.totalOp)],['Cat',achievement(a.catDone,t.catDone)],['Optical',achievement(a.opticalSold,t.opticalSold)],['Reviews',achievement(a.googleReview,t.googleReview)]]);drawPie('mixChart',revenueKeys.map(k=>[labels[k],a[k]]).filter(x=>x[1]>0))}
function monthlySeries(type,n){let out=[];let d=new Date();d.setDate(1);for(let i=n-1;i>=0;i--){let x=new Date(d);x.setMonth(d.getMonth()-i);let ym=x.toISOString().slice(0,7);let a=sumMonth(ym);out.push([ym,type==='revenue'?revenue(a):a.totalOp])}return out}
function canvas(id){let c=document.getElementById(id);if(!c)return null;let r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;let ctx=c.getContext('2d');ctx.scale(d,d);return [c,ctx,r.width,r.height]}
function drawLine(id,data){let z=canvas(id);if(!z)return;let [c,ctx,w,h]=z,p={l:42,r:12,t:15,b:28},max=Math.max(1,...data.map(x=>x[1])),min=0;ctx.clearRect(0,0,w,h);ctx.strokeStyle='#263a54';ctx.lineWidth=1;for(let i=0;i<5;i++){let y=p.t+(h-p.t-p.b)*i/4;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(w-p.r,y);ctx.stroke()}ctx.strokeStyle='#62a8ff';ctx.lineWidth=3;ctx.beginPath();data.forEach((x,i)=>{let px=p.l+(w-p.l-p.r)*i/(data.length-1||1),py=h-p.b-(x[1]-min)/(max-min||1)*(h-p.t-p.b);i?ctx.lineTo(px,py):ctx.moveTo(px,py);ctx.fillStyle='#62a8ff';ctx.beginPath();ctx.arc(px,py,3,0,Math.PI*2);ctx.fill();ctx.beginPath();i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();ctx.fillStyle='#9db0c8';ctx.font='11px system-ui';data.forEach((x,i)=>{let px=p.l+(w-p.l-p.r)*i/(data.length-1||1);ctx.fillText(x[0].slice(5),px-16,h-8)})}
function drawBar(id,data){let z=canvas(id);if(!z)return;let [c,ctx,w,h]=z,p={l:35,r:10,t:15,b:30},max=Math.max(100,...data.map(x=>x[1]));ctx.clearRect(0,0,w,h);data.forEach((x,i)=>{let bw=(w-p.l-p.r)/data.length*.62,bx=p.l+i*(w-p.l-p.r)/data.length+((w-p.l-p.r)/data.length-bw)/2,bh=(x[1]/max)*(h-p.t-p.b),by=h-p.b-bh;ctx.fillStyle='#62a8ff';ctx.fillRect(bx,by,bw,bh);ctx.fillStyle='#d8e6f8';ctx.font='11px system-ui';ctx.fillText(Math.round(x[1])+'%',bx,Math.max(12,by-5));ctx.fillStyle='#9db0c8';ctx.fillText(x[0],bx,h-9)})}
function drawPie(id,data){let z=canvas(id);if(!z)return;let [c,ctx,w,h]=z,total=data.reduce((s,x)=>s+x[1],0),cx=w*.36,cy=h*.5,r=Math.min(w,h)*.34,start=-Math.PI/2;ctx.clearRect(0,0,w,h);data.forEach((x,i)=>{let a=x[1]/total*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,start,start+a);ctx.closePath();ctx.fillStyle=['#62a8ff','#45d483','#ffc857','#ff6678','#a78bfa','#22d3ee','#f472b6','#94a3b8'][i%8];ctx.fill();start+=a});ctx.fillStyle='#9db0c8';ctx.font='11px system-ui';data.forEach((x,i)=>ctx.fillText(x[0]+': '+fmt(x[1],true),w*.68,22+i*18))}
function exportJSON(){download('LALIT_BH_backup.json',JSON.stringify(state,null,2),'application/json')}function exportCSV(){let rows=[['Date',...targetKeys]];Object.entries(state.daily).sort().forEach(([d,x])=>rows.push([d,...targetKeys.map(k=>normalize(x)[k])]));download('LALIT_BH_daily.csv',rows.map(r=>r.join(',')).join('\n'),'text/csv')}
function download(n,c,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
document.getElementById('backupBtn').onclick=exportJSON;document.getElementById('restoreBtn').onclick=()=>document.getElementById('restoreFile').click();document.getElementById('restoreFile').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();render();alert('Backup restored.')}catch(err){alert('Invalid backup file.')}};r.readAsText(f)};function wipe(){if(confirm('Delete ALL LALIT_BH local data from this device?')){localStorage.removeItem('lalit_bh_final');state=structuredClone(defaultState);render()}}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').onclick=async()=>{deferredPrompt.prompt();deferredPrompt=null}});if(window.matchMedia('(display-mode: standalone)').matches)document.getElementById('installBtn').classList.add('hidden');else document.getElementById('installBtn').onclick=()=>alert('In Chrome use ⋮ → Add to Home screen / Install app.');if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render();
